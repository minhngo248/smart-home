apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |

    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    
    # Plain MQTT listener
    listener 1883
    protocol mqtt
    allow_anonymous true

    # WS Listener
    listener 9001
    protocol websockets