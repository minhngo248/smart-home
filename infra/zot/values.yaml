service:
  type: ClusterIP

mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": { "address": "0.0.0.0", "port": "5000" },
      "log": { "level": "info" },
      "extensions": {
        "search": {
          "enable": true,
          "cve": { "updateInterval": "24h" }
        }
      }
    }

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: ca-homelab
  className: traefik
  pathtype: ImplementationSpecific
  hosts:
    - host: zot.local-pi
      paths:
        - path: /
  tls:
    - secretName: zot-tls
      hosts:
        - zot.local-pi

persistence: true

pvc:
  storage: 2Gi