apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-subscriber
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-subscriber
  template:
    metadata:
      labels:
        app: mqtt-subscriber
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      containers:
      - name: mqtt-subscriber
        image: ghcr.io/minhngo248/smart-home/mqtt-subscriber:v0.0
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: tapo-subscriber-env
